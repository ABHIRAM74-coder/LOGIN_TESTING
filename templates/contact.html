<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Us</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav>

    <div class="logo">

        My Application

    </div>


    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('about') }}">
            About
        </a>

        <a href="{{ url_for('contact') }}">
            Contact Us
        </a>

        <a href="{{ url_for('feedback') }}">
            Feedback
        </a>

        <a
            href="{{ url_for('logout') }}"
            class="logout-button"
        >

            Logout

        </a>

    </div>

</nav>


<main class="page">


    <h1>
        Contact Us
    </h1>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <div class="card">


        <form method="POST">


            <label>
                Name
            </label>


            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>
                Email
            </label>


            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Message
            </label>


            <textarea
                name="message"
                rows="6"
                placeholder="Enter your message"
                required
            ></textarea>


            <button type="submit">

                Send Message

            </button>


        </form>


    </div>


</main>


<script
    src="{{ url_for('static', filename='session.js') }}"
></script>


</body>

</html>
