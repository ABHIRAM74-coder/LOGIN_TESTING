<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav>

    <div class="logo">

        My Application

    </div>


    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('about') }}">
            About
        </a>

        <a href="{{ url_for('contact') }}">
            Contact Us
        </a>

        <a href="{{ url_for('feedback') }}">
            Feedback
        </a>

        <a
            href="{{ url_for('logout') }}"
            class="logout-button"
        >

            Logout

        </a>

    </div>

</nav>


<main class="page">


    <h1>
        Home
    </h1>


    <div class="card">


        <h2>
            Welcome
        </h2>


        <p>
            You have successfully logged in.
        </p>


        <p>

            Logged in as:

            <strong>
                {{ email }}
            </strong>

        </p>


        <p>

            If there is no activity for
            45 seconds, you will automatically
            be logged out.

        </p>


    </div>


</main>


<script
    src="{{ url_for('static', filename='session.js') }}"
></script>


</body>

</html>
