<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feedback</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav>

    <div class="logo">

        My Application

    </div>


    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('about') }}">
            About
        </a>

        <a href="{{ url_for('contact') }}">
            Contact Us
        </a>

        <a href="{{ url_for('feedback') }}">
            Feedback
        </a>

        <a
            href="{{ url_for('logout') }}"
            class="logout-button"
        >

            Logout

        </a>

    </div>

</nav>


<main class="page">


    <h1>
        Feedback
    </h1>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <div class="card">


        <form method="POST">


            <label>
                Rating
            </label>


            <select
                name="rating"
                required
            >


                <option value="">

                    Select Rating

                </option>


                <option value="5">

                    5 - Excellent

                </option>


                <option value="4">

                    4 - Very Good

                </option>


                <option value="3">

                    3 - Good

                </option>


                <option value="2">

                    2 - Average

                </option>


                <option value="1">

                    1 - Poor

                </option>


            </select>


            <label>
                Comments
            </label>


            <textarea
                name="comments"
                rows="6"
                placeholder="Enter your feedback"
                required
            ></textarea>


            <button type="submit">

                Submit Feedback

            </button>


        </form>


    </div>


</main>


<script
    src="{{ url_for('static', filename='session.js') }}"
></script>


</body>

</html>
